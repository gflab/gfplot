# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Hard dependencies plus the Suggests that are cheap and gate real
          # tests. The heavier optional back ends (DOSE, HTSanalyzeR2,
          # ggradar) come from Bioconductor or GitHub and stay absent on
          # purpose: gfplot is designed so library() works without them, and
          # the examples and tests skip rather than fail.
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::digest
            any::extrafont
            any::ggsignif
            any::glmnet
            any::Rtsne
            any::survivalROC
            any::timeROC
            any::umap
          dependencies: '"hard"'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
          # Not --as-cran: that forces every Suggests entry to be installable,
          # which contradicts the optional-back-end design above. The
          # explicit _R_CHECK_FORCE_SUGGESTS_=false env setting is what makes
          # an absent optional back end a note rather than a failure, and
          # error-on keeps real warnings fatal.
          args: 'c("--no-manual")'
